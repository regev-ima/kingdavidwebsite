name: Deploy Supabase Edge Functions

# Deploys every Edge Function under supabase/functions/ to the kcrm
# Supabase project whenever that directory changes on main, so Edge
# Functions stay in sync with the repo without anyone needing the
# Supabase CLI on their machine.
#
# One-time setup (add as GitHub repository secrets under Settings →
# Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN  Personal access token from
#                          https://supabase.com/dashboard/account/tokens
#
#   SUPABASE_PROJECT_REF   The ref of the kcrm project. Find it in the
#                          Supabase dashboard: Project Settings →
#                          General → Reference ID (looks like
#                          "abcdefghijklmnop").
#
# Resend secrets (RESEND_API_KEY, ORDER_EMAIL_FROM, ORDER_EMAIL_BCC)
# still live in the Supabase dashboard → Edge Functions → Secrets,
# not here.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function under supabase/functions
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repo secrets."
            exit 1
          fi
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            echo "→ Deploying $fn"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt
          done
